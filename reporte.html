<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reporte de bajas</title>
<style>
:root{
  --bg:#faf9f7;
  --surface:#ffffff;
  --surface-2:#f1efec;
  --border:#e4e1db;
  --border-strong:#d3cfc6;
  --text:#1c1a17;
  --text-dim:#6b665c;
  --text-muted:#9b9587;
  --accent:#e1293f;
  --accent-dim:#fdecee;
  --accent-ink:#ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --surface:#1f1c17; --surface-2:#262219;
    --border:#3a3427; --border-strong:#4d4635;
    --text:#f4f1ea; --text-dim:#b7b0a0; --text-muted:#847c6c;
    --accent:#ff5a6c; --accent-dim:#3a1a1e; --accent-ink:#1c0507;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1f1c17; --surface-2:#262219;
  --border:#3a3427; --border-strong:#4d4635;
  --text:#f4f1ea; --text-dim:#b7b0a0; --text-muted:#847c6c;
  --accent:#ff5a6c; --accent-dim:#3a1a1e; --accent-ink:#1c0507;
  color-scheme: dark;
}
html{min-height:100%;}
*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Nunito', system-ui, -apple-system, sans-serif;
  margin:0; padding-inline:20px; padding-block:32px 48px;
  min-height:100%;
}
h1,h2{ font-family:'Fraunces', Georgia, serif; }
.wrap{max-width:960px;margin:0 auto;}

.top-row{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
h1{font-size:22px;margin:0;text-wrap:balance;}
.subtitle{font-size:13px;color:var(--text-muted);margin:4px 0 0;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;min-width:0;}
.kpi .num{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
.kpi .lbl{font-size:11.5px;color:var(--text-muted);margin-top:4px;line-height:1.4;}

.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.btn{
  padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;
  cursor:pointer;border:1.5px solid var(--border-strong);background:var(--surface);
  color:var(--text);font-family:inherit;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}

.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.btn-icon{padding:10px 14px;font-size:15px;flex:none;}
#monthSelect{
  flex:1;min-width:0;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:700;
  background:var(--surface);border:1.5px solid var(--border-strong);color:var(--text);
  font-family:inherit;text-align:center;
}

.month-block{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;overflow:hidden;}
.month-block h2{margin:0 0 12px;font-size:16px;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
th{color:var(--text-muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
tr:last-child td{border-bottom:none;}

.empty{color:var(--text-muted);font-size:14px;padding:48px 0;text-align:center;}
.loading{color:var(--text-muted);font-size:14px;padding:48px 0;text-align:center;}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div>
      <h1>Reporte de bajas</h1>
      <p class="subtitle">Conectado en vivo con las respuestas de la encuesta — se actualiza solo, no hace falta recargar nada aparte.</p>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" id="refreshBtn">↻ Actualizar</button>
    <button class="btn" id="exportBtn">↓ Exportar CSV</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="month-nav" id="monthNav" style="display:none;">
    <button class="btn btn-icon" id="prevMonthBtn" aria-label="Mes anterior">←</button>
    <select id="monthSelect"></select>
    <button class="btn btn-icon" id="nextMonthBtn" aria-label="Mes siguiente">→</button>
  </div>

  <div id="monthlyReport"><p class="loading">Cargando respuestas...</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCm1udn0HrkAh6Z4ZvM8enzvyy3fHmevFQ",
  authDomain: "bajas-coghlan-club.firebaseapp.com",
  projectId: "bajas-coghlan-club",
  storageBucket: "bajas-coghlan-club.firebasestorage.app",
  messagingSenderId: "200916277966",
  appId: "1:200916277966:web:bfcec915827343ca538e9f"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

let allResponses = [];
let byMonth = {};
let monthKeys = [];
let currentMonthIndex = 0;

async function loadReport(){
  document.getElementById('monthlyReport').innerHTML = '<p class="loading">Cargando respuestas...</p>';
  try{
    const snap = await getDocs(collection(db, "respuestas"));
    allResponses = [];
    snap.forEach(docSnap=>{
      const data = docSnap.data();
      const ts = data.timestamp && data.timestamp.toDate ? data.timestamp.toDate() : new Date();
      allResponses.push({ ...data, _date: ts });
    });
    renderReport();
  }catch(err){
    console.error(err);
    document.getElementById('monthlyReport').innerHTML = '<p class="empty">No se pudieron cargar las respuestas. Probá actualizar de nuevo.</p>';
    document.getElementById('kpis').innerHTML = '';
  }
}

function renderReport(){
  const kpis = document.getElementById('kpis');
  const content = document.getElementById('monthlyReport');
  const nav = document.getElementById('monthNav');

  if(allResponses.length === 0){
    kpis.innerHTML = '';
    nav.style.display = 'none';
    content.innerHTML = '<p class="empty">Todavía no hay respuestas.</p>';
    return;
  }

  const total = allResponses.length;
  const rated = allResponses.filter(r=>r.rating);
  const ratingAlto = allResponses.filter(r=>r.rating >= 4).length;
  const avgRating = rated.length ? (rated.reduce((a,r)=>a+r.rating,0) / rated.length).toFixed(1) : '—';
  const pocoAcompaniamiento = allResponses.filter(r=>r.acompanamientoGym === 'Nunca' || r.acompanamientoGym === 'Rara vez').length;

  const itemCounts = {};
  allResponses.forEach(r=>{
    if(r.mejorasSalaSugeridas){
      r.mejorasSalaSugeridas.split(' | ').forEach(item=>{
        if(item === 'Estaba bien, no cambiaría nada') return;
        itemCounts[item] = (itemCounts[item]||0)+1;
      });
    }
  });
  const topEntry = Object.entries(itemCounts).sort((a,b)=>b[1]-a[1])[0];
  const topItemLabel = topEntry ? topEntry[0] + ' (' + topEntry[1] + ')' : '—';

  kpis.innerHTML =
    '<div class="kpi"><div class="num">' + total + '</div><div class="lbl">Respuestas totales (todos los meses)</div></div>' +
    '<div class="kpi"><div class="num">' + ratingAlto + '</div><div class="lbl">Rating 4-5 (derivados a Google)</div></div>' +
    '<div class="kpi"><div class="num">' + avgRating + '</div><div class="lbl">Rating promedio</div></div>' +
    '<div class="kpi"><div class="num">' + pocoAcompaniamiento + '</div><div class="lbl">Poco acompañamiento (gym)</div></div>' +
    '<div class="kpi" style="grid-column:span 2;"><div class="num" style="font-size:16px;">' + topItemLabel + '</div><div class="lbl">Mejora más pedida en sala</div></div>';

  // Agrupar por mes-año (clave ordenable: AAAA-MM)
  byMonth = {};
  allResponses.forEach(r=>{
    const sortKey = r._date.getFullYear() + '-' + String(r._date.getMonth()+1).padStart(2,'0');
    if(!byMonth[sortKey]) byMonth[sortKey] = { label: r._date.toLocaleDateString('es-AR', {month:'long', year:'numeric'}), items: [] };
    byMonth[sortKey].items.push(r);
  });

  monthKeys = Object.keys(byMonth).sort().reverse(); // más reciente primero

  if(currentMonthIndex >= monthKeys.length) currentMonthIndex = 0;

  nav.style.display = monthKeys.length > 1 ? 'flex' : 'none';
  const select = document.getElementById('monthSelect');
  select.innerHTML = monthKeys.map((k,i)=>{
    const label = byMonth[k].label;
    return '<option value="' + i + '">' + label.charAt(0).toUpperCase() + label.slice(1) + ' (' + byMonth[k].items.length + ')</option>';
  }).join('');
  select.value = currentMonthIndex;

  document.getElementById('prevMonthBtn').disabled = currentMonthIndex >= monthKeys.length - 1;
  document.getElementById('nextMonthBtn').disabled = currentMonthIndex <= 0;

  renderMonth(content);
}

function renderMonth(content){
  const key = monthKeys[currentMonthIndex];
  const month = byMonth[key];
  const items = month.items.slice().sort((a,b)=>b._date - a._date);

  const rows = items.map(r=>
    '<tr>' +
      '<td>' + r._date.toLocaleDateString('es-AR') + '</td>' +
      '<td>' + (r.actividad || '—') + '</td>' +
      '<td>' + (r.franjaHoraria || '—') + (r.horaExacta ? ' (' + r.horaExacta + ')' : '') + '</td>' +
      '<td>' + (r.motivoBaja || '—') + '</td>' +
      '<td>' + (r.mejorasSalaSugeridas || '—') + '</td>' +
      '<td>' + (r.rating || '—') + '</td>' +
      '<td>' + (r.comentario || '—') + '</td>' +
    '</tr>'
  ).join('');

  const label = month.label;
  content.innerHTML =
    '<div class="month-block">' +
      '<h2>' + label.charAt(0).toUpperCase() + label.slice(1) + ' — ' + items.length + ' respuesta(s)</h2>' +
      '<div class="table-scroll"><table>' +
        '<thead><tr><th>Fecha</th><th>Actividad</th><th>Horario</th><th>Motivo</th><th>Mejoras sala</th><th>Rating</th><th>Comentario</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>' +
    '</div>';
}

document.getElementById('monthSelect').addEventListener('change', (e)=>{
  currentMonthIndex = parseInt(e.target.value, 10);
  document.getElementById('prevMonthBtn').disabled = currentMonthIndex >= monthKeys.length - 1;
  document.getElementById('nextMonthBtn').disabled = currentMonthIndex <= 0;
  renderMonth(document.getElementById('monthlyReport'));
});

document.getElementById('prevMonthBtn').addEventListener('click', ()=>{
  if(currentMonthIndex < monthKeys.length - 1){
    currentMonthIndex++;
    document.getElementById('monthSelect').value = currentMonthIndex;
    document.getElementById('prevMonthBtn').disabled = currentMonthIndex >= monthKeys.length - 1;
    document.getElementById('nextMonthBtn').disabled = false;
    renderMonth(document.getElementById('monthlyReport'));
  }
});

document.getElementById('nextMonthBtn').addEventListener('click', ()=>{
  if(currentMonthIndex > 0){
    currentMonthIndex--;
    document.getElementById('monthSelect').value = currentMonthIndex;
    document.getElementById('nextMonthBtn').disabled = currentMonthIndex <= 0;
    document.getElementById('prevMonthBtn').disabled = false;
    renderMonth(document.getElementById('monthlyReport'));
  }
});

document.getElementById('refreshBtn').addEventListener('click', loadReport);

document.getElementById('exportBtn').addEventListener('click', ()=>{
  if(allResponses.length === 0){ alert('No hay respuestas para exportar'); return; }
  const headers = ['Fecha','Actividad','Franja','HoraExacta','AcompañamientoGym','MejorasSalaSugeridas','Motivo','Rating','Comentario'];
  const rows = allResponses.map(r=>[
    r._date.toLocaleDateString('es-AR'),
    r.actividad||'', r.franjaHoraria||'', r.horaExacta||'', r.acompanamientoGym||'',
    (r.mejorasSalaSugeridas||'').replace(/,/g,';'),
    r.motivoBaja||'', r.rating||'', (r.comentario||'').replace(/,/g,';')
  ]);
  const csv = [headers.join(','), ...rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'respuestas_encuesta_baja.csv';
  a.click();
  URL.revokeObjectURL(url);
});

loadReport();
</script>
</body>
</html>
